name: Secret Scan

# ═══════════════════════════════════════════════════════════════════════════
# SEC-003 — the per-repo CI half of the secret gate.
#
# This file is generated. Edit scripts/secrets/secret-scan.workflow.yml in the
# nx-workspace repo and re-run `npm run secrets:sync-ci`; a copy edited in place
# is overwritten.
#
# It scans the COMMITS BEING ADDED, not the whole history. That is deliberate:
# several repos here carry credentials in old commits (a GCP service-account key,
# a FontAwesome Pro token, Google API keys — SEC-001), and a job that is red on
# day one for something nobody can fix in this PR is a job that gets disabled
# within a week. Rotation is what fixes history; this job's business is stopping
# the next one.
#
# The current working tree is covered separately by the workspace gate
# (`npm run check:security`), which knows which public keys are acknowledged.
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan the entire git history instead of the incoming commits'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the commit range below needs both ends present.
          fetch-depth: 0

      - name: Resolve the commit range to scan
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_history }}" = "true" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "Scanning the entire history (requested manually)."
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "scope=range" >> "$GITHUB_OUTPUT"
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "scope=range" >> "$GITHUB_OUTPUT"
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            # A brand-new branch, a force-push, or a manual run: there is no
            # "before" to diff against, so fall back to the single head commit
            # rather than silently scanning nothing.
            echo "scope=range" >> "$GITHUB_OUTPUT"
            echo "range=${{ github.sha }}~1..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # The OSS gitleaks CLI runs directly from its image. The gitleaks-action
      # wrapper needs a paid GITLEAKS_LICENSE for private repositories; the
      # plain CLI does not.
      - name: Run gitleaks
        run: |
          set -euo pipefail
          if [ "${{ steps.range.outputs.scope }}" = "full" ]; then
            LOG_OPTS=""
          else
            LOG_OPTS="--log-opts=${{ steps.range.outputs.range }}"
          fi
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code 1 ${LOG_OPTS}
